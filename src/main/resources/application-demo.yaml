server:
  port: 8080
  servlet:
    context-path: /api/v1/digital-store

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/digital_store_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Cấu hình Gửi Email (Ví dụ: Mailtrap)
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: your_mailtrap_username_here
    password: your_mailtrap_password_here
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Cấu hình Đăng nhập Google OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your_google_client_id_here.apps.googleusercontent.com
            client-secret: your_google_client_secret_here
            scope: email, profile

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

jwt:
  signerKey: "your_jwt_secret_key_here_must_be_long_enough_for_hs512"
